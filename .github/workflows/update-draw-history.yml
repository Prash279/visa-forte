name: Update Express Entry Draw History

# Runs every day at 01:00 UTC (06:30 IST) to catch draws as soon as they are published.
# Also triggerable manually from the Actions tab.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync draw history from canada.ca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: scripts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Fetch and update draw history
        run: node scripts/update-draw-history.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes — skipping commit."
          else
            git config user.name "VisaForte Data Bot"
            git config user.email "bot@visaforte.com"
            git add apps/web/src/lib/crs-draw-history.json
            git commit -m "data: update EE draw history from canada.ca ($(date +%Y-%m-%d))"
            git push
            echo "Committed and pushed updated crs-draw-history.json"
          fi
