name: canada.ca monitor

on:
  schedule:
    # Every 6 hours at minute 0
    - cron: "0 */6 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 3 scrapers now launch a real browser (up to 60s networkidle wait × 3
    # retries each) on top of the Playwright browser install — 10 min was
    # tight even for the old httpx-only pipeline.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install Playwright browser
        env:
          DEBIAN_FRONTEND: noninteractive
        run: playwright install chromium --with-deps

      - name: Test DB connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import os, psycopg2
          url = os.environ.get("DATABASE_URL", "")
          if not url:
              raise SystemExit("ERROR: DATABASE_URL secret is not set in GitHub Actions")
          if url.startswith("postgres://"):
              url = url.replace("postgres://", "postgresql://", 1)
          if "sslmode=" not in url:
              url += ("&" if "?" in url else "?") + "sslmode=require"
          conn = psycopg2.connect(url)
          cur = conn.cursor()
          cur.execute("SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name")
          tables = [r[0] for r in cur.fetchall()]
          conn.close()
          print(f"DB connection OK. Public tables: {tables}")
          EOF

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.main