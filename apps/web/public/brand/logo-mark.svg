<svg viewBox="0 0 48 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Visa Forte — Threshold Mark -->
  <!-- Column width 12 : Passage width 24 = 1:2. Lintel height 18 = 30% of total. -->
  <path d="M0,0 L48,0 L48,60 L36,60 L36,18 L12,18 L12,60 L0,60 Z" fill="#0C2340"/>
  <!-- Saffron keystone accent: base of lintel, spanning the passage width -->
  <rect x="12" y="16" width="24" height="2" fill="#C97B1E"/>
</svg>
