# render.yaml — Visa Forte Infrastructure Blueprint
# Render reads this file to provision all services from one deploy.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Next.js Web App ──────────────────────────────────────────────────────────
  - type: web
    name: visaforte-web
    runtime: node
    # Point Render at the monorepo sub-directory that contains the Next.js app
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    # Auto-deploy every time a commit lands on main
    autoDeploy: true
    # Node 20 — matches the CI pipeline in tech.md §11
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Injected automatically from the Render-managed database below
      - key: DATABASE_URL
        fromDatabase:
          name: visaforte-db
          property: connectionString
      # Render generates a cryptographically random value on first deploy
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # The public site URL — used by Better Auth as its base URL
      - key: NEXT_PUBLIC_SITE_URL
        value: https://visaforte.com
      # Better Auth baseURL fallback (same value as above — both kept for clarity)
      - key: NEXTAUTH_URL
        value: https://visaforte.com

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: visaforte-db
    plan: free
    databaseName: visaforte
    user: visaforte_user
