# render.yaml — Visa Forte Infrastructure Blueprint
# Render reads this file to provision the web service on Phase 2+ migration.
# Database lives on Neon (persistent free tier) — set DATABASE_URL manually in Render dashboard.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Next.js Web App ──────────────────────────────────────────────────────────
  - type: web
    name: visaforte-web
    runtime: node
    # Point Render at the monorepo sub-directory that contains the Next.js app
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    # Auto-deploy every time a commit lands on main
    autoDeploy: true
    # Node 20 — matches the CI pipeline in tech.md §11
    envVars:
      - key: NODE_VERSION
        value: "20"
      # DATABASE_URL must be set manually in the Render dashboard.
      # Copy it from your Neon project dashboard (Settings → Connection string).
      - key: DATABASE_URL
        sync: false
      # Render generates a cryptographically random value on first deploy.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://visaforte.com
